@media (prefers-color-scheme: dark) {

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #151e1b; --surface-2: #1c2723; --fg: #e4ece8; --muted: #8fa19a; --line: #27342f;

<script>
"use strict";
/* Indicators and the per-timeframe analysis object. */
function EMA(v, n) {
  const out = new Array(v.length).fill(null);
  if (v.length < n) return out;
  let s = 0; for (let i = 0; i < n; i++) s += v[i];
  let e = s / n; out[n - 1] = e;
  const k = 2 / (n + 1);
  for (let i = n; i < v.length; i++) { e = v[i] * k + e * (1 - k); out[i] = e; }
  return out;
}
function SMA(v, n) {
  const out = new Array(v.length).fill(null);
  let s = 0;
  for (let i = 0; i < v.length; i++) {
    s += v[i];
    if (i >= n) s -= v[i - n];
    if (i >= n - 1) out[i] = s / n;
  }
  return out;
}
function RSI(v, n) {
  n = n || 14;
  const out = new Array(v.length).fill(null);
  if (v.length <= n) return out;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = v[i] - v[i - 1]; g += Math.max(d, 0); l += Math.max(-d, 0); }
  g /= n; l /= n;
  out[n] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  for (let i = n + 1; i < v.length; i++) {
    const d = v[i] - v[i - 1];
    g = (g * (n - 1) + Math.max(d, 0)) / n;
    l = (l * (n - 1) + Math.max(-d, 0)) / n;
    out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  }
  return out;
}
function ATR(c, n) {
  n = n || 14;
  const out = new Array(c.length).fill(null);
  if (c.length <= n) return out;
  const tr = c.map((x, i) => i === 0 ? x.h - x.l : Math.max(x.h - x.l, Math.abs(x.h - c[i - 1].c), Math.abs(x.l - c[i - 1].c)));
  let a = 0; for (let i = 1; i <= n; i++) a += tr[i];
  a /= n; out[n] = a;
  for (let i = n + 1; i < c.length; i++) { a = (a * (n - 1) + tr[i]) / n; out[i] = a; }
  return out;
}
/* tf is one entry of TFS. The last candle is still forming, so "closed" always means index length-2. */
function analyze(candles, tf) {
  const closes = candles.map(c => c.c);
  const a = {
    tf, candles, closes,
    ema20: EMA(closes, 20), ema50: EMA(closes, 50), ema200: EMA(closes, 200),
    rsi: RSI(closes, 14), atr: ATR(candles, 14), volSma: SMA(candles.map(c => c.v), 20)
  };
  a.swings = findSwings(a, tf.k);
  a.struct = structureOf(a);
  return a;
}
/* Simple EMA based trend. Used for the daily chart, which is kept as hidden background bias. */
function trendOf(a) {
  const i = a.candles.length - 2;
  const c = a.closes[i], e20 = a.ema20[i], e50 = a.ema50[i], e200 = a.ema200[i];
  let s = 0, max = 0;
  if (e50 != null) { max++; s += c > e50 ? 1 : -1; }
  if (e20 != null && e50 != null) { max++; s += e20 > e50 ? 1 : -1; }
  if (e50 != null && e200 != null) { max++; s += e50 > e200 ? 1 : -1; }
  if (e50 != null && i >= 5 && a.ema50[i - 5] != null) { max++; s += e50 > a.ema50[i - 5] ? 1 : -1; }
  const dir = s >= 2 ? "up" : s <= -2 ? "down" : "side";
  return { s, max, dir };
}

"use strict";

/* Swing highs and lows. Highs and lows alternate, and each swing is labelled against the one before it. */

      if (!hi && !lo) break;

    if (lo) raw.push({ i, p: c[i].l, type: "L" });

    const last = sw[sw.length - 1];

"use strict";
/* Asia, London and New York sessions: open/closed status, timeline and how the current coin behaves in each. */
const fmtCache = {};
function localHM(ms, tz) {
  const f = fmtCache[tz] || (fmtCache[tz] = new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false, year: "numeric", month: "2-digit", day: "2-digit" }));
  const p = {}; f.formatToParts(ms).forEach(x => { p[x.type] = x.value; });
  let h = +p.hour; if (h === 24) h = 0;
  return { h, m: +p.minute, day: p.year + "-" + p.month + "-" + p.day };
}
function sessionActive(s, ms) { const l = localHM(ms, s.tz); const t = l.h + l.m / 60; return t >= s.from && t < s.to; }
function sessionInfo(s, now) {
  const act = sessionActive(s, now); let t = now;
  for (let i = 1; i <= 48 * 12; i++) { t = now + i * 300000; if (sessionActive(s, t) !== act) break; }
  return { act, change: t };
}
/* Uses 1 hour candles (about 12 days). Sessions are measured from the first to the last candle inside the session window. */
function sessionStats(c) {
  const avgV = c.reduce((a, k) => a + k.v, 0) / c.length;
  return SESSIONS.map(s => {
    const m = new Map();
    c.forEach((k, idx) => {
      if (!sessionActive(s, k.t)) return;
      const key = localHM(k.t, s.tz).day; let g = m.get(key);
      if (!g) { g = { o: k.o, c: k.c, h: k.h, l: k.l, v: 0, n: 0, t: k.t, last: idx }; m.set(key, g); }
      g.c = k.c; g.h = Math.max(g.h, k.h); g.l = Math.min(g.l, k.l); g.v += k.v; g.n++; g.last = idx;
    });
    const arr = [...m.values()].sort((a, b) => a.t - b.t);
    const cur = arr[arr.length - 1] || null;
    const live = cur && cur.last === c.length - 1 ? cur : null;
    const full = arr.filter(g => g !== live && g.n >= 8).slice(-7);
    const mean = f => full.length ? full.reduce((a, g) => a + f(g), 0) / full.length : null;
    const hrs = arr.reduce((a, g) => a + g.n, 0), vs = arr.reduce((a, g) => a + g.v, 0);
    return { s, live: !!live, cur, curMove: cur ? (cur.c - cur.o) / cur.o * 100 : null,
      avgMove: mean(g => (g.c - g.o) / g.o * 100), avgRange: mean(g => (g.h - g.l) / g.o * 100),
      up: full.filter(g => g.c > g.o).length, nFull: full.length, volIdx: hrs ? (vs / hrs) / avgV : null };
  });
}

    return "Between sessions. " + nxt.s.name + " opens in " + fmtDur(nxt.i.change - now) + ".";
  }

  const first = open.map(s => ({ s, i: sessionInfo(s, now) })).sort((a, b) => a.i.change - b.i.change)[0];
  return "Now: " + names + " open" + (open.length > 1 ? " (overlap, usually the busiest hours)" : "") + ". " + first.s.name.split(" (")[0] + " closes in " + fmtDur(first.i.change - now) + ".";
}

<script>

/* Entry alerts: sound, browser pop-up, vibration and Telegram. Only fires for new setups, once per candle. */
let actx = null;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    [660, 880].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i * 0.18;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 0.18);
    });
  } catch (e) { /* sound not available */ }
}
async function tgSend(text) {
  const tok = store.get("tgTok", "").trim(), chat = store.get("tgChat", "").trim();
  if (!tok || !chat) return "Telegram not set";
  if (!/^\d+:[A-Za-z0-9_-]+$/.test(tok)) return "Telegram token looks wrong";
  try {
    const r = await fetch("https://api.telegram.org/bot" + tok + "/sendMessage", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: chat, text }) });
    const j = await r.json();
    return j.ok ? "Telegram sent" : "Telegram error: " + (j.description || r.status);
  } catch (e) { return "Telegram failed (" + (e && e.message ? e.message : "network") + ")"; }
}
function loadAlertLog() { try { return JSON.parse(store.get("alog", "[]")); } catch (e) { return []; } }
async function notify(title, body) {
  const out = [];
  state.alerts = [{ t: Date.now(), title, body }].concat(loadAlertLog()).slice(0, 15);
  store.set("alog", JSON.stringify(state.alerts));
  if (store.get("aSound", "1") === "1") { beep(); out.push("sound"); }
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ }
  try {
    if (typeof Notification !== "undefined" && Notification.permission === "granted") { new Notification(title, { body, tag: title }); out.push("pop-up"); }
  } catch (e) { /* phones block this */ }
  try { document.title = "● " + title; } catch (e) { /* ignore */ }
  const tg = await tgSend(title + "\n" + body);
  if (tg === "Telegram sent") out.push("Telegram"); else if (tg !== "Telegram not set") out.push(tg);
  if (typeof renderAlertLog === "function") renderAlertLog();

}
const seenAlerts = (() => { try { return JSON.parse(store.get("seen", "{}")); } catch (e) { return {}; } })();
function markSeen(key) {
  seenAlerts[key] = Date.now();

}

}

}

}

  const t = $("scanTable"); if (!t) return;
  const rows = state.scan.rows;
  t.innerHTML = '<thead><tr><th>Coin</th><th>Price</th><th>Signal</th><th>Entry type</th><th>Score</th><th title="4H, 1H, 15m structure">4H 1H 15m</th><th>RSI 15m</th><th>Candle</th><th>Entry / Stop / Target 1</th></tr></thead><tbody>' +
    (rows.length ? rows.map(r => {
      const s = r.sig, act = s.verdict.indexOf("SETUP") > -1 || s.verdict.indexOf("WATCH") > -1;
      return '<tr data-pair="' + r.c.pair + '" tabindex="0" class="' + (r.c.pair === state.symbol ? "cur" : "") + '"><td><b>' + esc(r.c.sym) + '</b> <span class="mute-t">' + fmtCap(r.c.mc) + '</span></td>' +
        '<td class="num">' + fp(s.price) + '</td><td><span class="pill ' + s.cls + '">' + esc(s.verdict) + '</span></td><td>' + (s.zone ? esc(s.zone.type.toLowerCase()) : '<span class="mute-t">-</span>') + '</td>' +
        '<td class="num">' + s.score + '/' + s.max + '</td><td>' + arrow(s.struct.h4.dir) + ' ' + arrow(s.struct.h1.dir) + ' ' + arrow(s.struct.m15.dir) + '</td>' +
        '<td class="num">' + (s.rsi15 == null ? "n/a" : s.rsi15.toFixed(0)) + '</td>' +
        '<td>' + (s.patBest ? '<span class="' + (s.patBest.bias === "bull" ? "up-t" : s.patBest.bias === "bear" ? "down-t" : "mute-t") + '">' + esc(s.patBest.name) + '</span> <span class="mute-t">' + s.patBest.tf + '</span>' : '<span class="mute-t">-</span>') + '</td>' +
        '<td class="num">' + (act && s.zone && s.sl ? fp(s.price) + ' / <span class="down-t">' + fp(s.sl) + '</span> / <span class="up-t">' + fp(s.tp1) + '</span>' : '<span class="mute-t">-</span>') + '</td></tr>';
    }).join("") : '<tr><td colspan="9" class="mute-t">No results yet. Press Scan now.</td></tr>') + '</tbody>';
}
let scanTimer = null;
function setupScanUi() {
  $("topn").value = store.get("topn", "30"); $("scanEvery").value = store.get("scanEvery", "2");
  $("scanBtn").addEventListener("click", runScan);
  const as = $("autoscan"); as.checked = store.get("autoscan", "1") === "1";
  const setTimer = () => { clearInterval(scanTimer); if (as.checked) scanTimer = setInterval(runScan, +$("scanEvery").value * 60000); };
  as.addEventListener("change", () => { store.set("autoscan", as.checked ? "1" : "0"); setTimer(); });
  $("scanEvery").addEventListener("change", () => { store.set("scanEvery", $("scanEvery").value); setTimer(); });
  setTimer();
  const open = async e => {
    const tr = e.target.closest ? e.target.closest("tr[data-pair]") : null; if (!tr) return;
    state.symbol = tr.dataset.pair; $("sym").value = state.symbol; await loadSymbol(); renderPage();
    try { window.scrollTo({ top: $("signalCard").offsetTop - 12, behavior: "smooth" }); } catch (err) { /* ignore */ }
  };
  $("scanTable").addEventListener("click", open);
  $("scanTable").addEventListener("keydown", e => { if (e.key === "Enter") open(e); });
}
function renderPage() { renderSignal(); renderNewsStrip(); renderRisk(); renderScan(); }
function onSlowTick() { renderNewsStrip(); }

boot({
  file: "index.html", title: "Signals", data: true, symbolBox: true, skeleton: SIGNALS_SKELETON, render: renderPage,
  init: setupScanUi,
  after: async () => {
    runScan();
    await loadAllNews(false);
    if (state.A["5m"]) { state.sig = buildSignal(state.A); renderPage(); }
  }
});

</script>
